async function fetchSetCards(setId) {
  // Use hardcoded data if available
  if(HARDCODED_SETS[setId]) return HARDCODED_SETS[setId];
  if(UNSUPPORTED_SETS.includes(setId)) return [];
  const tcgSetId = TCG_SET_IDS[setId];
  if (!tcgSetId) return [];
  try {
    let allCards = [];
    let page = 1;
    while(true) {
      const res = await fetch(`${TCG_API}/cards?q=set.id:${tcgSetId}&pageSize=250&page=${page}&orderBy=number`, {
        headers: { 'X-Api-Key': '' }
      });
      const data = await res.json();
      const cards = data.data || [];
      allCards = allCards.concat(cards.map(c => ({
        name: c.name,
        number: c.number,
        rarity: c.rarity || 'Common',
        supertype: c.supertype,
      })));
      if(cards.length < 250) break;
      page++;
    }
    allCards.sort((a, b) => parseInt(a.number) - parseInt(b.number));
    return allCards;
  } catch(e) {
    console.log('TCG API error:', e);
    return [];
  }
}

function getCardPrice(rarity, isReverse, setId) {
  if(['Rare Ultra', 'Rare Secret', 'Rare Rainbow', 'Hyper Rare', 'Special Illustration Rare', 'Illustration Rare', 'Double Rare', 'Rare Holo V', 'Rare Holo VMAX', 'Rare Holo VSTAR', 'Rare Holo ex', 'ACE SPEC Rare'].includes(rarity)) {
    return 'POA';
  }
  // 151 reverses are priced individually due to nostalgia premium
  if(setId === '151' && isReverse) {
    return 'POA';
  }
  if(isReverse) {
    if(['Common', 'Uncommon', 'Promo'].includes(rarity)) return '£1.00';
    return '£1.25'; // Rare reverse
  }
  if(['Common', 'Uncommon', 'Promo'].includes(rarity)) return '£0.25';
  if(['Rare', 'Rare Holo'].includes(rarity)) return '£0.50';
  return 'POA';
}

  const options = [];
  setCards.forEach(c => {

}

function searchCards() {
  clearTimeout(cardSearchTimeout);

    resultsEl.innerHTML = matches.map(c =>

}

async function db(method, table, body, query = '') {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + table + query, {
    method,
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      Prefer: method === 'POST' ? 'return=representation' : '',
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok && method !== 'PATCH') throw new Error(await res.text());
  if (method === 'GET') return res.json();
  return res.json().catch(() => null);
}

async function hashPassword(pw) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

  else if (page === 'news') renderNews();
  else if (page === 'requests') renderRequests();
}

async function signIn() {
  const email = document.getElementById('si-email').value.trim().toLowerCase();
  const pass = document.getElementById('si-pass').value;
  const err = document.getElementById('signin-err');
  err.style.display = 'none';
  try {
    const hash = await hashPassword(pass);
    const res = await db('GET', 'wantlist_customers', null, `?email=eq.${encodeURIComponent(email)}&password_hash=eq.${hash}&select=*`);
    if (!res || !res.length) { err.textContent = 'Invalid email or password'; err.style.display = 'block'; return; }
    currentUser = res[0];
    localStorage.setItem('rh_wl_user', JSON.stringify(currentUser));
    enterApp();
  } catch(e) { err.textContent = 'Error signing in. Please try again.'; err.style.display = 'block'; }
}

async function register() {
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim().toLowerCase();
  const phone = document.getElementById('reg-phone').value.trim();
  const pass = document.getElementById('reg-pass').value;
  const err = document.getElementById('reg-err');
  err.style.display = 'none';
  if (!name || !email || !phone || !pass) { err.textContent = 'Please fill in all fields'; err.style.display = 'block'; return; }
  if (pass.length < 6) { err.textContent = 'Password must be at least 6 characters'; err.style.display = 'block'; return; }
  try {
    const hash = await hashPassword(pass);
    const res = await db('POST', 'wantlist_customers', { name, email, phone, password_hash: hash });
    console.log('Register response:', JSON.stringify(res));
    if (!res || !res.length) { err.textContent = 'Account may already exist. Try signing in. Debug: ' + JSON.stringify(res); err.style.display = 'block'; return; }
    currentUser = res[0];
    localStorage.setItem('rh_wl_user', JSON.stringify(currentUser));
    enterApp();
  } catch(e) { err.textContent = 'Error: ' + e.message; err.style.display = 'block'; }
}

function signOut() {
  currentUser = null;
  localStorage.removeItem('rh_wl_user');
  renderAuth();
}

function enterApp() {
  document.getElementById('user-badge').textContent = currentUser.name.split(' ')[0];

let _qty = 1;
function changeQty(delta) {
  _qty = Math.max(1, (_qty || 1) + delta);
  document.getElementById('qty-display').textContent = _qty;
}

function selectType(type) {
  selectedType = type;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('active', b.textContent === type));
}

function addToList() {
  const sel = document.getElementById('card-select');
  const manualInput = document.getElementById('card-search-input');
  let name = '', number = '', cardPrice = '';

  if (sel) {
    if (!sel.value) { alert('Please select a card'); return; }
    const parts = sel.value.split('|');
    name = sel.options[sel.selectedIndex].text.split(' · ')[0];
    number = parts[0];
    cardPrice = parts[3] || '';
  } else if (manualInput) {
    name = manualInput.value.trim();
    number = document.getElementById('card-number-manual') ? document.getElementById('card-number-manual').value.trim() : '';
    if (!name) { alert('Please enter a card name'); return; }
  }

  const notes = document.getElementById('card-notes') ? document.getElementById('card-notes').value.trim() : '';
  wantList.push({
    id: Date.now(),
    setId: selectedSet.id,
    setName: selectedSet.name,
    cardName: name,
    cardNumber: number,
    cardType: selectedType,
    price: cardPrice,
    quantity: _qty || 1,
  });
  saveWantList();
  if (sel) sel.value = '';
  window._selectedCardNumber = '';
  _qty = 1;
  document.getElementById('qty-display').textContent = '1';
  document.getElementById('set-cards').innerHTML = renderSetCards();
}

function renderSetCards() {
  const cards = wantList.filter(c => c.setId === selectedSet.id);
  if (!cards.length) return '<div class="empty">No cards added from this set yet</div>';
  return cards.map(c => `
    <div class="want-item">
      <div class="want-item-info">
        <div class="want-item-name">${c.cardName} ${c.cardNumber ? '· ' + c.cardNumber : ''}</div>
        <div class="want-item-meta">x${c.quantity} · <span class="want-badge ${TYPE_BADGE[c.cardType] || 'badge-common'}">${c.cardType}</span>${c.price ? ' · <span style="color:var(--green);font-weight:600;">' + (c.price === 'POA' ? 'Price on request' : c.price + (c.quantity > 1 ? ' each' : '')) + '</span>' : ''}</div>
      </div>
      <button class="btn-sm" onclick="removeFromList(${c.id})" style="color:var(--red);border-color:rgba(232,0,29,0.3);">✕</button>
    </div>`).join('');
}

function removeFromList(id) {
  wantList = wantList.filter(c => c.id !== id);
  saveWantList();
  if (selectedSet) document.getElementById('set-cards').innerHTML = renderSetCards();
  if (currentPage === 'list') renderList();
}

async function submitList() {
  if (!wantList.length) return;
  const notes = document.getElementById('submission-notes') ? document.getElementById('submission-notes').value.trim() : '';
  try {
    const res = await db('POST', 'want_requests', {
      customer_id: currentUser.id,
      customer_name: currentUser.name,
      customer_phone: currentUser.phone,
      customer_email: currentUser.email,
      cards: JSON.stringify(wantList),
      notes,
      status: 'pending',
      submitted_at: new Date().toISOString(),
    });

    // WhatsApp notification
    const totalCards = wantList.reduce((sum, c) => sum + c.quantity, 0);
    const sets = [...new Set(wantList.map(c => c.setName))].join(', ');
    const msg = '📋 NEW WANT LIST from ' + currentUser.name + ' (' + (currentUser.phone || currentUser.email) + ')\n\n' + totalCards + ' cards across: ' + sets + '\n\nCheck the admin app to review and respond.';
    window.open('https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(msg), '_blank');

    wantList = [];
    saveWantList();
    document.getElementById('app').innerHTML = `
      <div class="section" style="text-align:center;padding:30px;">
        <div style="font-size:40px;margin-bottom:12px;">🎉</div>
        <div style="font-weight:700;font-size:18px;margin-bottom:8px;">Want List Submitted!</div>

        <button class="btn" onclick="showPage('browse')">Browse More Sets</button>
      </div>`;
  } catch(e) { alert('Error submitting. Please try again.'); }
}

function clearList() {

}

async function renderRequests() {
  document.getElementById('app').innerHTML = '<div class="empty">Loading...</div>';
  try {
    const requests = await db('GET', 'want_requests', null, `?customer_id=eq.${currentUser.id}&order=submitted_at.desc`);
    if (!requests || !requests.length) {
      document.getElementById('app').innerHTML = `
        <div class="section" style="text-align:center;padding:30px;">
          <div style="font-size:32px;margin-bottom:12px;">📦</div>
          <div style="font-weight:600;margin-bottom:6px;">No requests yet</div>
          <div style="font-size:13px;color:var(--muted);">Submit your want list and it will appear here.</div>
        </div>`;
      return;
    }
    document.getElementById('app').innerHTML = requests.map(r => {
      const cards = JSON.parse(r.cards || '[]');
      const date = new Date(r.submitted_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
      const statusColor = r.status === 'responded' ? 'var(--green)' : r.status === 'declined' ? 'var(--red)' : 'var(--amber)';
      const statusLabel = r.status === 'responded' ? '✅ Responded' : r.status === 'declined' ? '❌ Declined' : '⏳ Pending';
      return `<div class="section" style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <div style="font-size:12px;color:var(--muted);">${date} · ${cards.length} card${cards.length !== 1 ? 's' : ''}</div>
          <div style="font-size:12px;font-weight:700;color:${statusColor};">${statusLabel}</div>
        </div>
        ${cards.slice(0,3).map(c => `
          <div style="font-size:12px;color:var(--muted);padding:3px 0;border-bottom:1px solid var(--border);">${c.cardName} · ${c.setName} · <span class="want-badge ${TYPE_BADGE[c.cardType] || 'badge-common'}">${c.cardType}</span></div>`).join('')}
        ${cards.length > 3 ? `<div style="font-size:11px;color:var(--muted);margin-top:6px;">+${cards.length - 3} more cards</div>` : ''}
        ${r.response ? `<div style="margin-top:10px;background:rgba(0,208,132,0.08);border:1px solid rgba(0,208,132,0.2);border-radius:8px;padding:10px;font-size:13px;">${r.response}</div>` : ''}
      </div>`;
    }).join('');
  } catch(e) { document.getElementById('app').innerHTML = '<div class="empty">Error loading requests</div>'; }
}

function showPublicPage(page) {
  document.getElementById('bottom-nav-public').querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('nav-public-' + page);
  if (btn) btn.classList.add('active');

  else if(page === 'news') renderNews();
}

async function renderBuyingBoard() {
  document.getElementById('app').innerHTML = `
    <div style="text-align:center;margin-bottom:20px;">
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:900;letter-spacing:1px;">WE'RE BUYING</div>
      <div style="font-size:13px;color:var(--muted);margin-top:4px;">Cards we're actively looking for at enhanced rates</div>
    </div>
    <div style="background:rgba(255,179,0,0.06);border:1px solid rgba(255,179,0,0.2);border-radius:12px;padding:14px;margin-bottom:16px;">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center;">
        <div>
          <div style="font-size:11px;color:var(--amber);font-weight:700;text-transform:uppercase;letter-spacing:.5px;">Cash Rate</div>
          <div style="font-size:24px;font-weight:900;color:var(--amber);">70%</div>
          <div style="font-size:10px;color:var(--muted);">of market value</div>
        </div>
        <div>
          <div style="font-size:11px;color:var(--green);font-weight:700;text-transform:uppercase;letter-spacing:.5px;">Store Credit</div>
          <div style="font-size:24px;font-weight:900;color:var(--green);">80%</div>
          <div style="font-size:10px;color:var(--muted);">of market value</div>
        </div>
      </div>
    </div>
    <div id="buying-board-cards"><div class="empty-state">Loading...</div></div>`;

  try {
    const requests = await db('GET', 'want_requests', null, '?status=neq.declined&order=submitted_at.desc');
    if(!requests || !requests.length) {
      document.getElementById('buying-board-cards').innerHTML = '<div class="empty-state">No active buying requests right now — check back soon!</div>';
      return;
    }

    // Aggregate only published cards
    const cardMap = {};
    requests.forEach(r => {
      const cards = JSON.parse(r.cards || '[]');
      const publishedCards = JSON.parse(r.published_cards || '[]');
      cards.forEach(c => {
        const cardKey = c.cardName + '|' + c.setName + '|' + (c.cardNumber||'');
        if(!publishedCards.includes(cardKey)) return; // skip unpublished
        const key = c.cardName + '|' + c.setName + '|' + c.cardType;
        if(!cardMap[key]) cardMap[key] = { cardName: c.cardName, setName: c.setName, cardNumber: c.cardNumber || '', cardType: c.cardType || '', count: 0, totalQty: 0 };
        cardMap[key].count++;
        cardMap[key].totalQty += (c.quantity || 1);
      });
    });

    const cards = Object.values(cardMap).sort((a, b) => b.count - a.count);

    document.getElementById('buying-board-cards').innerHTML = cards.map(c => {
      const urgency = c.count >= 3 ? 'var(--red)' : c.count >= 2 ? 'var(--amber)' : 'var(--green)';
      const msg = 'Hi Rockets Hideout! I saw you\'re looking for ' + c.cardName + ' (' + c.setName + (c.cardNumber ? ' #' + c.cardNumber : '') + ') — I have one available. Are you still buying?';
      const waUrl = 'https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(msg);
      return `<div class="section" style="margin-bottom:8px;padding:12px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <div>
            <div style="font-size:14px;font-weight:700;">${c.cardName}</div>
            <div style="font-size:11px;color:var(--muted);">${c.setName}${c.cardNumber ? ' · #' + c.cardNumber : ''} · ${c.cardType}</div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:16px;font-weight:900;color:${urgency};">${c.totalQty > 1 ? 'x' + c.totalQty : '⚡'}</div>
            <div style="font-size:10px;color:var(--muted);">${c.totalQty > 1 ? 'needed' : 'wanted'}</div>
          </div>
        </div>
        <a href="${waUrl}" target="_blank" style="display:block;text-align:center;text-decoration:none;width:100%;background:rgba(37,211,102,0.15);border:1.5px solid rgba(37,211,102,0.4);border-radius:9px;color:#25d366;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:.5px;text-transform:uppercase;padding:11px;">💬 I Have This Card</a>
      </div>`;
    }).join('');
  } catch(e) {
    document.getElementById('buying-board-cards').innerHTML = '<div class="empty-state">Unable to load right now. Please try again.</div>';
  }
}

// ── NEWS ──
function renderNewsCard(article) {
  const titleLower = article.title.toLowerCase();
  let tag = '', tagColor = '';
  if (titleLower.includes('reveal') || titleLower.includes('preview')) { tag = 'Reveal'; tagColor = 'var(--blue)'; }
  else if (titleLower.includes('tournament') || titleLower.includes('champion') || titleLower.includes('worlds') || titleLower.includes('regionals')) { tag = 'Tournament'; tagColor = 'var(--amber)'; }
  else if (titleLower.includes('set') || titleLower.includes('expansion') || titleLower.includes('celebration')) { tag = 'New Set'; tagColor = 'var(--green)'; }
  else if (titleLower.includes('promo')) { tag = 'Promo'; tagColor = 'var(--red)'; }
  else { tag = 'News'; tagColor = 'var(--muted)'; }

  const safeLink = (article.link || '#').replace(/'/g, "\\'");
  return `<div class="section" style="margin-bottom:8px;padding:14px;cursor:pointer;" onclick="window.open('${safeLink}','_blank')">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;">
      <div style="font-size:11px;font-weight:700;color:${tagColor};text-transform:uppercase;letter-spacing:.5px;">${tag}</div>
      <div style="font-size:10px;color:var(--muted);">${article.date || ''}</div>
    </div>
    <div style="font-size:14px;font-weight:700;line-height:1.3;margin-bottom:6px;">${article.title}</div>
    ${article.summary ? `<div style="font-size:12px;color:var(--muted);line-height:1.4;">${article.summary}</div>` : ''}
    <div style="margin-top:10px;font-size:11px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.5px;">Read More →</div>
  </div>`;
}

async function renderNews() {
  const appEl = document.getElementById('app');
  appEl.innerHTML = `
    <div style="text-align:center;margin-bottom:20px;">
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:900;letter-spacing:1px;">📰 TCG NEWS</div>
      <div style="font-size:13px;color:var(--muted);margin-top:4px;">Latest from PokéBeach</div>
    </div>
    <div id="news-feed"><div style="text-align:center;padding:30px;color:var(--muted);">
      <div style="font-size:24px;margin-bottom:8px;">⏳</div>
      <div>Fetching latest news...</div>
    </div></div>`;

  // Try multiple CORS-friendly RSS proxy services in sequence
  const proxies = [
    () => fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent('https://www.pokebeach.com/feed')}&count=12`)
          .then(r => r.json())
          .then(d => {
            if (d.status !== 'ok' || !d.items?.length) throw new Error('rss2json failed');
            return d.items.map(item => ({
              title: item.title,
              link: item.link,
              date: item.pubDate ? new Date(item.pubDate).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '',
              summary: (item.description || '').replace(/<[^>]*>/g, '').replace(/&[^;]+;/g, ' ').trim().slice(0, 130)
            }));
          }),
    () => fetch(`https://corsproxy.io/?${encodeURIComponent('https://www.pokebeach.com/feed')}`)
          .then(r => r.text())
          .then(text => {
            const xml = new DOMParser().parseFromString(text, 'text/xml');
            const items = [...xml.querySelectorAll('item')].slice(0, 12);
            if (!items.length) throw new Error('No items');
            return items.map(item => ({
              title: item.querySelector('title')?.textContent || 'Untitled',
              link: item.querySelector('link')?.textContent || '#',
              date: (() => { const d = item.querySelector('pubDate')?.textContent; return d ? new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : ''; })(),
              summary: (item.querySelector('description')?.textContent || '').replace(/<[^>]*>/g, '').replace(/&[^;]+;/g, ' ').trim().slice(0, 130)
            }));
          }),
  ];

  let articles = null;
  for (const attempt of proxies) {
    try { articles = await attempt(); if (articles?.length) break; } catch(e) { /* try next */ }
  }

  if (articles && articles.length) {
    document.getElementById('news-feed').innerHTML = articles.map(renderNewsCard).join('');
  } else {
    document.getElementById('news-feed').innerHTML = `
      <div class="section" style="text-align:center;padding:24px;">
        <div style="font-size:32px;margin-bottom:12px;">📡</div>
        <div style="font-weight:600;margin-bottom:6px;">Couldn't load news right now</div>
        <div style="font-size:13px;color:var(--muted);margin-bottom:16px;">This works best when the app is opened in a browser with internet access. You can also visit PokéBeach directly.</div>
        <a href="https://www.pokebeach.com" target="_blank" style="display:inline-block;background:var(--red);color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:.5px;text-transform:uppercase;padding:11px 22px;border-radius:9px;text-decoration:none;">Visit PokéBeach</a>
      </div>`;
  }
}
